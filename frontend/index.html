<!doctype html>
	<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>CSG-DSL</title>
		<link rel="stylesheet" href="/styles.css">
	</head>
	<body>
		<header>
			<h1>CSG-DSL</h1>
		</header>

		<main>
			<section id="editor-pane">
				<div class="toolbar">
					<button id="btn-compile">Compile</button>
					<button id="btn-run">Run</button>
					<label class="chk">
						<input type="checkbox" id="chk-axes"> Show axes
					</label>
					<span id="status"></span>
				</div>
				<div id="editor-host" class="editor-host" aria-label="CSG editor"></div>
			</section>

			<section id="output-pane">
				<div class="viewport-wrapper" style="position:relative;display:inline-block;">
					<canvas id="viewport" width="640" height="480"></canvas>
					<canvas id="gizmo" width="160" height="160" style="position:absolute;right:8px;top:8px;pointer-events:auto;border-radius:4px;background:rgba(16,16,18,0.6);" title="View Gizmo"></canvas>
				</div>
				<div id="log">
					<button id="btn-clear" class="log-clear" aria-label="Clear log">✕</button>
					<div id="log-entries" class="log-entries"></div>
				</div>
			</section>
		</main>

		<script src="https://unpkg.com/monaco-editor@0.55.1/min/vs/loader.js"></script>
		<script type="module" src="/app.js"></script>
	</body>
</html>
