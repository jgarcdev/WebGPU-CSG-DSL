<!doctype html>
	<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>CSG-DSL WebGPU — Editor</title>
		<link rel="stylesheet" href="/styles.css">
	</head>
	<body>
		<header>
			<h1>CSG-DSL WebGPU — Editor</h1>
		</header>

		<main>
			<section id="editor-pane">
				<div class="toolbar">
					<button id="btn-compile">Compile</button>
					<button id="btn-run">Run</button>
					<span id="status"></span>
				</div>
				<div id="editor-host" class="editor-host" aria-label="CSG editor"></div>
			</section>

			<section id="output-pane">
				<canvas id="viewport" width="640" height="480"></canvas>
				<div id="log"></div>
			</section>
		</main>

		<script src="https://unpkg.com/monaco-editor@0.55.1/min/vs/loader.js"></script>
		<script type="module" src="/app.js"></script>
	</body>
</html>
